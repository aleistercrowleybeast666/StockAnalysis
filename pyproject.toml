[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-analysis"
version = "0.5.0"
description = "Local desktop generator for A-share and Hong Kong stock analysis workbooks"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Private personal-use project" }
authors = [{ name = "StockAnalysis" }]
dependencies = [
  "PySide6>=6.8,<7",
  "httpx>=0.27,<1",
  "openpyxl>=3.1.5,<4",
  "platformdirs>=4.3,<5",
  "tenacity>=9,<10",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.12,<7",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pytest-qt>=4.4,<5",
  "ruff>=0.11,<1",
]

[project.scripts]
stock-analysis = "stock_analysis.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "network: small live-network integration tests",
]

[tool.coverage.run]
branch = true
source = ["stock_analysis"]

[tool.coverage.report]
show_missing = true
skip_covered = false
omit = [
  "src/stock_analysis/ui/*",
  "src/stock_analysis/__main__.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".venv",
  ".pytest_cache",
  ".ruff_cache",
  ".codex_artifacts",
  ".git-codex-backup",
  "build",
  "dist",
  "release",
  "artifacts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
